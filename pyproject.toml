[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cordon"
version = "0.1.0"
description = "Guardrailed intent-driven control plane for cloud infrastructure management"
authors = [{ name = "Paul Tsai Adinata", email = "paultsai.id@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.90",
    "boto3>=1.34",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["cordon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
